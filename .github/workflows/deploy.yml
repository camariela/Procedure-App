name: Deploy to GitHub Pages

# No build step: the app is plain ES modules, so the repository is the artifact.
on:
  push:
    branches:
      - main
      - claude/emergency-medicine-procedures-app-otfp4l
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the catalogue loads and every record is well formed
        run: node --input-type=module -e "
          const { PROCEDURES, SYSTEM_INDEX } = await import('./src/data/index.js');
          if (!PROCEDURES.length) throw new Error('no procedures');
          console.log(\`\${PROCEDURES.length} procedures across \${SYSTEM_INDEX.length} systems\`);
          "

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
