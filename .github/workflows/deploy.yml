name: Deploy to GitHub Pages

# The repository is the artifact: the app is plain ES modules and the compiled
# stylesheet is committed, so nothing is built here. The CSS is rebuilt only to
# prove the committed copy matches its source.
on:
  push:
    branches:
      - main
      - claude/emergency-medicine-procedures-app-otfp4l
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the catalogue loads and every record is well formed
        run: node --input-type=module -e "
          const { PROCEDURES, SYSTEM_INDEX } = await import('./src/data/index.js');
          if (!PROCEDURES.length) throw new Error('no procedures');
          console.log(\`\${PROCEDURES.length} procedures across \${SYSTEM_INDEX.length} systems\`);
          "

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the committed stylesheet matches its source
        run: |
          npm ci
          npm run build:css
          git diff --exit-code --stat src/styles/app.css \
            || { echo '::error::src/styles/app.css is stale. Run `npm run build:css` and commit the result.'; exit 1; }

      - uses: actions/configure-pages@v5

      - name: Drop build-only files from the artifact
        run: rm -rf node_modules package.json package-lock.json src/styles/app.src.css

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
